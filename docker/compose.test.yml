# Local integration test bed.
#
#   bun run testbed:up     # start Jellyfin, run the setup wizard, seed a library
#   bun run test:integration
#   bun run testbed:down   # stop and delete all state
#
# Everything is disposable: config/cache live in named volumes and the media
# tree is generated by scripts/testbed.ts. Nothing here is used in production.

name: tsarr-testbed

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: tsarr-testbed-jellyfin
    ports:
      # Loopback only: the test bed provisions a known admin account, so it must
      # not be reachable from other hosts while it is running.
      - '127.0.0.1:18096:8096'
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./testdata/media:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:18096
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8096/System/Info/Public || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  jellyfin-config:
  jellyfin-cache:
