# Local integration test bed.
#
#   bun run testbed:up     # start both servers, run their wizards, seed libraries
#   bun run test:integration
#   bun run testbed:down   # stop and delete all state
#
# Two Jellyfin servers run side by side: the current stable release, and the
# next major. The generated client is built from the 12.0 spec while most people
# still run 10.11, so both have to pass before we can claim either works.
#
# Everything is disposable: config/cache live in named volumes and the media
# tree is generated by scripts/testbed.ts. Nothing here is used in production.

name: tsarr-testbed

x-jellyfin: &jellyfin
  volumes: &jellyfin-volumes
    - ./testdata/media:/media:ro
  healthcheck: &jellyfin-healthcheck
    test: ['CMD-SHELL', 'curl -fsS http://localhost:8096/System/Info/Public || exit 1']
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s

services:
  # Current stable. This is what the CLI targets by default.
  jellyfin:
    <<: *jellyfin
    image: jellyfin/jellyfin:10.11.11
    container_name: tsarr-testbed-jellyfin
    ports:
      # Loopback only: the test bed provisions a known admin account, so it must
      # not be reachable from other hosts while it is running.
      - '127.0.0.1:18096:8096'
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./testdata/media:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:18096
    healthcheck: *jellyfin-healthcheck

  # Next major release. Pinned to a specific RC rather than a floating tag so a
  # new upstream RC cannot turn CI red without a commit here.
  jellyfin-12:
    <<: *jellyfin
    image: jellyfin/jellyfin:12.0-rc6
    container_name: tsarr-testbed-jellyfin-12
    ports:
      - '127.0.0.1:18097:8096'
    volumes:
      - jellyfin12-config:/config
      - jellyfin12-cache:/cache
      - ./testdata/media:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:18097
    healthcheck: *jellyfin-healthcheck

volumes:
  jellyfin-config:
  jellyfin-cache:
  jellyfin12-config:
  jellyfin12-cache:
