name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: arc-tsarr
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Generate API clients and types
        run: bun run generate && bun run generate:types

      - name: Check for generator drift
        run: |
          if ! git diff --exit-code --quiet -- src/generated; then
            echo "::error::Generated files are out of date. Run 'bun run generate && bun run generate:types' locally and commit the result."
            git --no-pager diff --stat -- src/generated
            exit 1
          fi

      - name: Run TypeScript check
        run: bun run typecheck

      - name: Check type coverage
        run: bun run typecheck:coverage

      - name: Run linter
        run: bun run lint

      - name: Run tests
        run: bun test
        
      - name: Build project
        run: bun run build:js && bun run build:types

  integration:
    name: Integration (Jellyfin test bed)
    runs-on: arc-tsarr
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate API clients and types
        run: bun run generate && bun run generate:types

      # The runner image ships the Docker CLI without the Compose v2 plugin.
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Start Jellyfin test bed
        run: bun run testbed:up

      - name: Run integration tests
        run: bun run test:integration

      - name: Exercise every Jellyfin CLI command
        run: bun run testbed:smoke

      - name: Jellyfin container logs
        if: failure()
        run: docker compose -f docker/compose.test.yml logs --tail 200

      - name: Tear down test bed
        if: always()
        run: bun run testbed:down

  nix-flake:
    runs-on: arc-tsarr

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Nix flake
        run: |
          docker run --rm \
            -v "$PWD/packaging/nix:/work" \
            -w /work \
            nixos/nix:2.24.14 \
            sh -lc 'nix build .#default --extra-experimental-features "nix-command flakes"'
