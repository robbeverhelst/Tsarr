# bun lint / bun fmt settings. Both run through the pinned canary
# (bun@1.4.3-canary.20261014.1, see package.json). The Bun 1.4.3 runtime and
# tests ignore these sections.
#
# Replaces biome.json. [lint.rules] turns on every Biome "recommended" rule
# that has a bun lint equivalent; the mapping table is in the PR that added
# this file.

# Same options biome.json set. Biome only formatted JS/TS/JSON, so Markdown
# and YAML stay untouched, as do package.json and renovate.json.
[fmt]
printWidth = 100
tabWidth = 2
semi = true
singleQuote = true
trailingComma = "es5"
arrowParens = "avoid"
endOfLine = "lf"
ignorePatterns = [
  "dist/**",
  "src/generated/**",
  "**/*.generated.ts",
  "**/*.md",
  "**/*.yml",
  "**/*.yaml",
  "package.json",
  "renovate.json",
]

[lint]
ignorePatterns = ["dist/**", "src/generated/**", "**/*.generated.ts"]

[lint.rules]
# Turned off in biome.json, kept off here.
"typescript/no-explicit-any" = "off"
"typescript/no-non-null-assertion" = "off"
"unicorn/no-array-for-each" = "off"
# Biome's noDoubleEquals allows == null.
"eslint/eqeqeq" = ["error", "always", { null = "ignore" }]
# Biome's noInvalidUseBeforeDeclaration only reports uses in the same scope,
# not calls to functions declared further down.
"eslint/no-use-before-define" = [
  "error",
  { functions = false, classes = false, variables = false, typedefs = false },
]
# Biome's organizeImports sorted import statements; import/order checks the
# statement order. Biome's member order inside { } has no exact match.
"import/order" = ["error", { alphabetize = { order = "asc", caseInsensitive = true } }]
"eslint/array-callback-return" = "error"
"eslint/constructor-super" = "error"
"eslint/default-case-last" = "error"
"eslint/dot-notation" = "error"
"eslint/for-direction" = "error"
"eslint/getter-return" = "error"
"eslint/no-array-constructor" = "error"
