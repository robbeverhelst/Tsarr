# bun fmt / bun lint settings. Both run through the pinned canary
# (bun@1.4.3-canary.20261014.1, see package.json). The Bun 1.4.3 runtime and
# tests ignore these sections.

# The formatter options biome.json had. Biome never formatted Markdown, YAML
# or TOML, CHANGELOG.md is written by semantic-release, and package.json /
# renovate.json were excluded in biome.json, so all of those stay untouched.
[fmt]
printWidth = 100
tabWidth = 2
semi = true
singleQuote = true
trailingComma = "es5"
arrowParens = "avoid"
endOfLine = "lf"
# Replaces Biome's organizeImports.
sortImports = true
ignorePatterns = [
  "dist/**",
  "src/generated/**",
  "**/*.generated.ts",
  "**/*.svg",
  "package.json",
  "renovate.json",
  "**/*.md",
  "**/*.mdx",
  "**/*.html",
  "**/*.yml",
  "**/*.yaml",
  "**/*.toml",
]

[lint]
ignorePatterns = ["dist/**", "src/generated/**", "**/*.generated.ts"]

# Every Biome recommended rule that bun lint has without needing types; the
# rest stays in biome.json (see the mapping table in the PR that added this).
[lint.rules]
# Turned off in biome.json, kept off here.
"typescript/no-explicit-any" = "off"
"typescript/no-non-null-assertion" = "off"
"unicorn/no-array-for-each" = "off"
"eslint/array-callback-return" = "error"
"eslint/constructor-super" = "error"
"eslint/default-case-last" = "error"
"eslint/dot-notation" = "error"
"eslint/eqeqeq" = ["error", "always", { null = "ignore" }]
"eslint/for-direction" = "error"
"eslint/getter-return" = "error"
"eslint/no-array-constructor" = "error"
